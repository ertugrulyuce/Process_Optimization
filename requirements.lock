# Commit edilmis raporlari ureten tam surumler (calisma bagimliliklari).
#
#   pip install -r requirements.lock
#
# requirements.txt yeni kurulum icin alt sinirlari tanimlar; bu dosya
# `run_all.py` + `tools/report_manifest.py` ile raporlari birebir yeniden
# uretecek ortami sabitler. Gelistirme araclari (pytest, ruff) burada yok,
# requirements-dev.txt icinde.
#
# Python 3.11-3.13. scipy bilincli olarak 1.17.1: 1.18 Python 3.11'i birakti.
# Raporlar 1.18.1 ile uretilmisti; bu lock'la temiz bir ortamda tam pipeline
# yeniden calistirildi, 24 rapor manifestle ayni (2026-09-27).
#
# Yenilemek icin: temiz bir venv'de `pip install -r requirements.txt`,
# `pip freeze`, sonra run_all.py + report_manifest.py ile raporlarin
# degismedigini dogrulayin. requirements.txt ile uyum
# tests/test_requirements_lock.py icinde test ediliyor.
