# CI: lint + testler + import kontrolu + rapor manifesti.
#
# Ham veri repoda yok (bkz. .gitignore), bu yuzden CI pipeline'i CALISTIRMAZ.
# Calistirilabilecek dort sey var: (1) ruff (kural seti ruff.toml icinde),
# (2) veriye dokunmayan testler, (3) her modulun import edilebilirligi --
# src/ duz dizin yapisinda oldugu icin (paket degil) bir dosya tasindiginda
# import zinciri sessizce kirilabiliyor, (4) commit edilen raporlarin
# manifestle (reports/MANIFEST.sha256) tutarliligi. Ayrica requirements.lock'un
# her Python surumunde kurulabilir oldugu kurulum yapilmadan dogrulanir.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Lock'taki tam surumler bu Python surumu icin gercekten var mi? Kurmadan
      # cozer. requirements.txt ile uyumu tests/test_requirements_lock.py
      # dogruluyor; bu adim ise "kurulabilir mi" sorusunu cevapliyor (scipy
      # 1.18 ornegin Python 3.11'i biraktigi icin lock 1.17.1'de).
      - name: Lock kurulabilir mi
        run: pip install --dry-run --ignore-installed -r requirements.lock

      - name: Lint
        run: ruff check .

      - name: Import kontrolu
        run: python tools/check_imports.py

      - name: Testler
        run: pytest

      # Pipeline burada calismaz (ham veri yok); bu adim yalnizca commit
      # edilen raporlarin manifestle tutarli oldugunu dogrular. Elle
      # duzenlenmis bir rapor ya da --update unutulmus bir cikti burada
      # kirmiziya doner. Asil yeniden uretim kontrolu yerelde:
      # run_all.py ardindan ayni komut.
      - name: Rapor manifesti
        run: python tools/report_manifest.py

      # Makefile bir kisayol; dogrulanmazsa sessizce bozulur (gelistiricilerin
      # cogu Windows'ta, make'siz calisiyor). `make test` gercekten calistirilip
      # komutlarinin dogru oldugu gorulur -- yukaridaki adimlarla ayni isi
      # tekrar yapar, birkac saniye. Testlerin sessizce atlanmasi riski yok:
      # pytest zaten yukarida dogrudan calisti.
      # run/clean/dashboard yalnizca -n ile cozulur: run ham veriyi, clean
      # uretilen ciktilari, dashboard streamlit'i ve bir tarayiciyi gerektiriyor.
      # -n yine de hedefin var oldugunu dogrular: `make dashboard` README'de ve
      # `make help`te yaziyordu ama kurali hic eklenmemisti, burada denenmedigi
      # icin fark edilmedi.
      - name: Makefile hedefleri
        run: |
          make help
          make test
          make check-reports
          make -n run clean dashboard
