# CI: lint + testler + import kontrolu.
#
# Ham veri repoda yok (bkz. .gitignore), bu yuzden CI pipeline'i CALISTIRMAZ.
# Calistirilabilecek uc sey var: (1) ruff (kural seti ruff.toml icinde),
# (2) veriye dokunmayan testler, (3) her modulun import edilebilirligi --
# src/ duz dizin yapisinda oldugu icin (paket degil) bir dosya tasindiginda
# import zinciri sessizce kirilabiliyor.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Import kontrolu
        run: python tools/check_imports.py

      - name: Testler
        run: pytest

      # Makefile bir kisayol; dogrulanmazsa sessizce bozulur (gelistiricilerin
      # cogu Windows'ta, make'siz calisiyor). `make test` gercekten calistirilip
      # komutlarinin dogru oldugu gorulur -- yukaridaki adimlarla ayni isi
      # tekrar yapar, birkac saniye. Testlerin sessizce atlanmasi riski yok:
      # pytest zaten yukarida dogrudan calisti.
      # run/clean yalnizca -n ile cozulur: ikisi de ham veriyi ya da uretilen
      # ciktilari gerektiriyor, CI'da ikisi de yok.
      - name: Makefile hedefleri
        run: |
          make help
          make test
          make -n run clean
